<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- 卡片背景 -->
  <rect x="1" y="1" width="758" height="418" rx="16" fill="#FFFFFF" stroke="#E4E4E7"/>

  <!-- 顶部公式 -->
  <text x="380" y="44" text-anchor="middle" font-size="16" fill="#18181B">h = ReLU( w·x + b )</text>

  <!-- 连线：输入层 → 隐藏层 -->
  <g stroke="#D4D4D8" stroke-width="1.2" fill="none">
    <path d="M 140 150 C 260 150, 260 100, 380 100"/>
    <path d="M 140 150 C 260 150, 260 210, 380 210"/>
    <path d="M 140 150 C 260 150, 260 320, 380 320"/>
    <path d="M 140 290 C 260 290, 260 100, 380 100"/>
    <path d="M 140 290 C 260 290, 260 210, 380 210"/>
    <path d="M 140 290 C 260 290, 260 320, 380 320"/>
  </g>
  <!-- 连线：隐藏层 → 输出层 -->
  <g stroke="#D4D4D8" stroke-width="1.2" fill="none">
    <path d="M 380 100 C 500 100, 500 210, 620 210"/>
    <path d="M 380 210 C 500 210, 500 210, 620 210"/>
    <path d="M 380 320 C 500 320, 500 210, 620 210"/>
  </g>

  <!-- 权重标注（示例两条） -->
  <text x="252" y="112" text-anchor="middle" font-size="11" fill="#A1A1AA">w₁</text>
  <text x="252" y="305" text-anchor="middle" font-size="11" fill="#A1A1AA">w₂</text>

  <!-- 输入层 -->
  <circle cx="140" cy="150" r="26" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="140" cy="290" r="26" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="140" y="155" text-anchor="middle" font-size="16" font-weight="600" fill="#4F46E5">x₁</text>
  <text x="140" y="295" text-anchor="middle" font-size="16" font-weight="600" fill="#4F46E5">x₂</text>

  <!-- 隐藏层 -->
  <circle cx="380" cy="100" r="26" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="380" cy="210" r="26" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="380" cy="320" r="26" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="380" y="105" text-anchor="middle" font-size="16" font-weight="600" fill="#D97706">h₁</text>
  <text x="380" y="215" text-anchor="middle" font-size="16" font-weight="600" fill="#D97706">h₂</text>
  <text x="380" y="325" text-anchor="middle" font-size="16" font-weight="600" fill="#D97706">h₃</text>

  <!-- 输出层 -->
  <circle cx="620" cy="210" r="26" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="215" text-anchor="middle" font-size="16" font-weight="600" fill="#059669">y</text>

  <!-- 层标注 -->
  <text x="140" y="388" text-anchor="middle" font-size="13" fill="#71717A">输入层</text>
  <text x="380" y="388" text-anchor="middle" font-size="13" fill="#71717A">隐藏层（激活函数）</text>
  <text x="620" y="388" text-anchor="middle" font-size="13" fill="#71717A">输出层</text>

</svg>
