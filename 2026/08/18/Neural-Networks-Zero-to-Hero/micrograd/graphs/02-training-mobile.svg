<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 472" width="320" height="472" role="img" aria-labelledby="title" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Noto Sans SC', 'Microsoft YaHei', monospace">
<title id="title">从输入、输出到 Loss function</title>
