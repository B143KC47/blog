<text x="160.0" y="50.0" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#e6e6e6" data-label="Feed input">Feed input</text>
</g>
<g data-node="P"><rect x="64" y="112" width="192" height="52" fill="#111111" stroke="#7c7c7c" stroke-width="1.4"/>
<text x="160.0" y="138.0" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#e6e6e6" data-label="Process">Process</text>
