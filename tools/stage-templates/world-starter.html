<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="blog-embed-mode" content="viewport">
  <title>Interactive World Starter</title>
  <style>
    :root {
      --bg: #08090c;
      --fg: #eceff4;
      --muted: #9aa2b1;
      --line: rgba(255, 255, 255, 0.14);
      --accent: #74c0fc;
      --chip: rgba(16, 18, 24, 0.78);
    }
    :root[data-theme="light"] {
      --bg: #f6f7f9;
      --fg: #17191e;
      --muted: #5c6370;
      --line: rgba(0, 0, 0, 0.12);
      --accent: #1971c2;
      --chip: rgba(255, 255, 255, 0.86);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }
    canvas:active { cursor: grabbing; }
    .hud {
      position: fixed;
      right: 14px;
      bottom: 14px;
      max-width: calc(100% - 28px);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--chip);
      backdrop-filter: blur(8px);
    }
    .hud-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: var(--accent);
    }
    .hud-nodes {
      display: flex;
      gap: 5px;
    }
    .hud-nodes button {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--fg);
      border-radius: 5px;
      padding: 2px 7px;
      font-size: 11px;
      cursor: pointer;
    }
    .hud-nodes button:hover,
    .hud-nodes button[aria-pressed="true"] {
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <canvas id="viewport" aria-label="Interactive 3D lattice"></canvas>
  <div class="hud">
    <span class="hud-badge" id="status-label">ready</span>
    <div class="hud-nodes" id="node-buttons"></div>
  </div>

  <script>
    (function () {
      'use strict';

      const canvas = document.getElementById('viewport');
      const ctx = canvas.getContext('2d');
      const statusLabel = document.getElementById('status-label');
      const nodeButtons = document.getElementById('node-buttons');

      // Sample 3D graph nodes; replace with Three.js, WebGL, Gaussian Splatting, or simulation state.
      const NODES = [
        { id: 'overview', label: 'Overview', pos: [0, 0, 0] },
        { id: 'perception', label: 'Perception', pos: [-1.3, 0.7, 0.5] },
        { id: 'memory', label: 'Memory', pos: [1.2, 0.6, -0.4] },
        { id: 'action', label: 'Action', pos: [0.1, -1.1, 0.9] }
      ];
      const EDGES = [[0, 1], [0, 2], [0, 3], [1, 2], [2, 3], [3, 1]];

      const PRESETS = {
        overview: { yaw: 0.55, pitch: 0.32, zoom: 1.0, highlight: 'overview' },
        perception: { yaw: -0.65, pitch: 0.38, zoom: 1.28, highlight: 'perception' },
        memory: { yaw: 0.95, pitch: 0.35, zoom: 1.28, highlight: 'memory' },
        action: { yaw: 0.15, pitch: -0.55, zoom: 1.28, highlight: 'action' }
      };

      const cam = { yaw: 0.55, pitch: 0.32, zoom: 1.0 };
      const targetCam = { yaw: 0.55, pitch: 0.32, zoom: 1.0 };
      let activeHighlight = 'overview';
      let lastMessageAction = 'boot';

      // Expose state for inspection and automated tests
      window.__worldState = {
        get activeHighlight() { return activeHighlight; },
        get lastAction() { return lastMessageAction; },
        get camera() { return { ...targetCam }; }
      };

      function setHighlight(id, notifyReader) {
        activeHighlight = id || 'overview';
        statusLabel.textContent = 'state: ' + activeHighlight;
        for (const btn of nodeButtons.querySelectorAll('button')) {
          btn.setAttribute('aria-pressed', String(btn.dataset.nodeId === activeHighlight));
        }
        if (notifyReader && window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'blackcat:reader',
            action: 'jumpTo',
            entryId: activeHighlight
          }, '*');
        }
      }

      NODES.forEach(node => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.nodeId = node.id;
        btn.textContent = node.label;
        btn.addEventListener('click', () => {
          const p = PRESETS[node.id] || PRESETS.overview;
          Object.assign(targetCam, { yaw: p.yaw, pitch: p.pitch, zoom: p.zoom });
          setHighlight(node.id, true);
        });
        nodeButtons.appendChild(btn);
      });

      function applyStagePayload(data) {
        lastMessageAction = data.action || 'message';
        if (data.theme === 'light' || data.theme === 'dark') {
          document.documentElement.dataset.theme = data.theme;
        }
        if (data.action === 'reset') {
          Object.assign(targetCam, PRESETS.overview);
          setHighlight('overview', false);
          return;
        }
        const st = data.state || {};
        const key = st.preset || st.highlight || data.entryId;
        if (key && PRESETS[key]) {
          Object.assign(targetCam, {
            yaw: PRESETS[key].yaw,
            pitch: PRESETS[key].pitch,
            zoom: PRESETS[key].zoom
          });
        }
        if (Array.isArray(st.camera) && st.camera.length >= 2) {
          targetCam.yaw = Number(st.camera[0]) || 0;
          targetCam.pitch = Number(st.camera[1]) || 0;
          if (st.camera[2] != null) targetCam.zoom = Number(st.camera[2]) || 1;
        }
        if (key) setHighlight(String(key), false);
      }

      window.addEventListener('message', ev => {
        if (!ev.data || ev.data.type !== 'blackcat:stage') return;
        applyStagePayload(ev.data);
      });

      // Pointer orbit & wheel zoom
      let drag = null;
      canvas.addEventListener('pointerdown', ev => {
        drag = { x: ev.clientX, y: ev.clientY, yaw: targetCam.yaw, pitch: targetCam.pitch };
        canvas.setPointerCapture(ev.pointerId);
      });
      canvas.addEventListener('pointermove', ev => {
        if (!drag) return;
        targetCam.yaw = drag.yaw + (ev.clientX - drag.x) * 0.008;
        targetCam.pitch = Math.max(-1.3, Math.min(1.3, drag.pitch + (ev.clientY - drag.y) * 0.008));
      });
      canvas.addEventListener('pointerup', () => { drag = null; });
      canvas.addEventListener('wheel', ev => {
        ev.preventDefault();
        targetCam.zoom = Math.max(0.5, Math.min(2.5, targetCam.zoom * Math.exp(-ev.deltaY * 0.0015)));
      }, { passive: false });

      function resize() {
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        canvas.width = Math.max(1, Math.floor(window.innerWidth * dpr));
        canvas.height = Math.max(1, Math.floor(window.innerHeight * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();
      setHighlight('overview', false);

      function project([x, y, z], w, h) {
        const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
        const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
        const x1 = x * cy - z * sy;
        const z1 = x * sy + z * cy;
        const y2 = y * cp - z1 * sp;
        const z2 = y * sp + z1 * cp + 4.2;
        const scale = (Math.min(w, h) * 0.42 * cam.zoom) / Math.max(1.2, z2);
        return { x: w / 2 + x1 * scale, y: h / 2 - y2 * scale, z: z2, r: Math.max(5, 18 / z2 * cam.zoom) };
      }

      function render() {
        cam.yaw += (targetCam.yaw - cam.yaw) * 0.12;
        cam.pitch += (targetCam.pitch - cam.pitch) * 0.12;
        cam.zoom += (targetCam.zoom - cam.zoom) * 0.12;

        const w = window.innerWidth, h = window.innerHeight;
        const light = document.documentElement.dataset.theme === 'light';
        ctx.clearRect(0, 0, w, h);

        const pts = NODES.map(n => ({ node: n, p: project(n.pos, w, h) }));
        ctx.strokeStyle = light ? 'rgba(25, 113, 194, 0.28)' : 'rgba(116, 192, 252, 0.28)';
        ctx.lineWidth = 1.4;
        for (const [a, b] of EDGES) {
          ctx.beginPath();
          ctx.moveTo(pts[a].p.x, pts[a].p.y);
          ctx.lineTo(pts[b].p.x, pts[b].p.y);
          ctx.stroke();
        }

        pts.sort((a, b) => b.p.z - a.p.z);
        for (const { node, p } of pts) {
          const isCurrent = node.id === activeHighlight;
          ctx.beginPath();
          ctx.arc(p.x, p.y, isCurrent ? p.r * 1.45 : p.r, 0, Math.PI * 2);
          ctx.fillStyle = isCurrent
            ? (light ? '#1971c2' : '#74c0fc')
            : (light ? '#5c6370' : '#8b95a7');
          ctx.fill();
          ctx.fillStyle = light ? '#17191e' : '#eceff4';
          ctx.font = (isCurrent ? '600 ' : '400 ') + '12px ui-sans-serif, system-ui, sans-serif';
          ctx.fillText(node.label, p.x + p.r + 7, p.y + 4);
        }
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
